# R4OS standard QEMU config.
# CPU, RAM, SMP, display and serial are selected by Build.bat or its caller.

[machine]
  type = "q35"

[drive "r4osboot"]
  file = "disk.img"
  if = "none"
  format = "raw"
  cache = "none"
  id = "r4osboot"

[drive "r4osdata"]
  file = "data.img"
  if = "none"
  format = "raw"
  cache = "none"
  id = "r4osdata"

[device "legacy-ide"]
  driver = "piix3-ide"
  id = "legacyide"

[device "boot-disk"]
  driver = "ide-hd"
  drive = "r4osboot"
  bus = "legacyide.0"
  unit = "0"

[device "nvme-controller"]
  driver = "nvme"
  id = "nvme0"
  serial = "R4OSNVME0"

[device "nvme-data"]
  driver = "nvme-ns"
  drive = "r4osdata"
  bus = "nvme0"
  nsid = "1"

[device "audio-controller"]
  driver = "ich9-intel-hda"

[device "audio-codec"]
  driver = "hda-duplex"
