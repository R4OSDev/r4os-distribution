# R4OS benchmark environment r4os-q35-haswell-1vcpu-1g-tcg-v1.
# CPU, accelerator, RAM, SMP, display, serial and network are fixed by
# Tests/Invoke-QemuBenchmark.ps1. Relative paths are rooted at Runs/current.

[machine]
  type = "q35"

[drive "r4osboot"]
  file = "../../disk.img"
  if = "none"
  format = "raw"
  cache = "none"
  id = "r4osboot"

[drive "r4osdata"]
  file = "data.img"
  if = "none"
  format = "raw"
  cache = "none"
  id = "r4osdata"

[device "legacy-ide"]
  driver = "piix3-ide"
  id = "legacyide"

[device "boot-disk"]
  driver = "ide-hd"
  drive = "r4osboot"
  bus = "legacyide.0"
  unit = "0"

[device "data-disk"]
  driver = "ide-hd"
  drive = "r4osdata"
  bus = "legacyide.0"
  unit = "1"

[device "audio-controller"]
  driver = "ich9-intel-hda"

[device "audio-codec"]
  driver = "hda-duplex"
  audiodev = "benchmark-audio"
